<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ことばのカード" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="description" content="声が届きづらいとき、入力した文を大きく相手に見せるコミュニケーション補助アプリ" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet" />
  <title>ことばのカード</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      font-family: "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      touch-action: none;
    }

    /* ── APP SHELL ── */
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #fff;
    }

    /* ── CARD ── */
    #card-wrap {
      position: absolute;
      inset: 0;
      will-change: transform;
      transition: transform 0.3s cubic-bezier(0.05,0.7,0.1,1);
    }
    #card-wrap.no-transition {
      transition: none;
    }
    #card-wrap.fly-out {
      transform: translateX(-110%) !important;
      transition: transform 0.26s cubic-bezier(0.4,0,0.2,1) !important;
    }

    #card {
      position: absolute;
      inset: 12px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Text display area */
    #display-area {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    /* The big visible text */
    #display-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 40px 28px 92px;
      z-index: 1;
    }
    #display-text p {
      margin: 0;
      font-weight: 900;
      color: #1c1c1c;
      line-height: 1.2;
      letter-spacing: -0.01em;
      word-break: break-word;
      white-space: pre-wrap;
      text-align: center;
      width: 100%;
    }

    /* Placeholder */
    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }
    #placeholder span {
      font-size: 22px;
      font-weight: 400;
      color: #bdbdbd;
      letter-spacing: 0.02em;
      text-align: center;
    }

    /* The invisible textarea on top */
    #input-area {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 1;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      -webkit-text-fill-color: transparent;
      caret-color: transparent;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-align: center;
      resize: none;
      cursor: text;
      z-index: 2;
      -webkit-appearance: none;
      padding: 40px 28px 92px;
      font-family: "Noto Sans JP", sans-serif;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    #caret-marker {
      position: absolute;
      display: none;
      width: 2px;
      background: #1c1c1c;
      pointer-events: none;
      z-index: 4;
    }

    /* Swipe hint label */
    #card-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 3;
    }
    #card-hint.visible {
      opacity: 0.3;
    }
    #card-hint svg { display: block; }
    #card-hint span {
      font-size: 10px;
      font-weight: 500;
      color: #1c1c1c;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    /* ── SWIPE HINT (left edge indicator) ── */
    #swipe-hint {
      position: fixed;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.15s;
    }
    #swipe-hint.visible {
      opacity: 1;
    }
    #swipe-hint .arrow {
      color: #9e9e9e;
      animation: hint-pulse 1.4s ease-in-out infinite;
    }
    #swipe-hint .bar {
      width: 6px;
      height: 40px;
      border-radius: 3px;
      background: rgba(100,100,100,0.35);
      animation: hint-pulse 1.4s ease-in-out infinite;
    }
    @keyframes hint-pulse {
      0%, 100% { opacity: 0.4; transform: translateX(0); }
      50%       { opacity: 1;   transform: translateX(-4px); }
    }

    /* ── HISTORY BUTTON ── */
    #history-btn {
      position: fixed;
      left: max(12px, env(safe-area-inset-left));
      top: max(12px, env(safe-area-inset-top));
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 1px 4px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0,0,0,.06);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    #history-btn:active {
      transform: scale(0.92);
    }

    #text-controls {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(320px, calc(100vw - 120px));
      min-width: 190px;
      padding: 10px 12px;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
      z-index: 20;
      font-family: "Noto Sans JP", sans-serif;
    }
    #font-size-slider {
      flex: 1;
      min-width: 0;
      accent-color: #424242;
    }
    #font-size-value {
      min-width: 36px;
      color: #616161;
      font-size: 11px;
      text-align: right;
      white-space: nowrap;
    }
    #auto-size-btn, #theme-btn {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      background: #f5f5f5;
      color: #424242;
      cursor: pointer;
      font-family: "Noto Sans JP", sans-serif;
    }
    #auto-size-btn {
      min-width: 48px;
      padding: 6px 8px;
      font-size: 12px;
    }
    #auto-size-btn.active {
      background: #424242;
      border-color: #424242;
      color: #fff;
    }
    #theme-btn {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      top: max(12px, env(safe-area-inset-top));
      display: flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 1px 4px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.08);
      z-index: 20;
    }

    #history-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      background: #424242;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
      padding: 0 4px;
      display: none;
      font-family: "Noto Sans JP", sans-serif;
    }

    /* ── DRAWER BACKDROP ── */
    #drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.32);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #drawer-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    /* ── DRAWER PANEL ── */
    #drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(88vw, 340px);
      height: 100%;
      height: 100dvh;
      background: #fafafa;
      border-radius: 28px 0 0 28px;
      box-shadow: -4px 0 24px rgba(0,0,0,.12);
      z-index: 31;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.05,0.7,0.1,1);
    }
    #drawer.open {
      transform: translateX(0);
    }

    /* Drawer header */
    #drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 12px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }
    #drawer-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #drawer-title {
      font-size: 16px;
      font-weight: 700;
      color: #1c1c1c;
      margin: 0;
    }
    #drawer-count-badge {
      font-size: 11px;
      font-weight: 600;
      color: #757575;
      background: #eee;
      border-radius: 8px;
      padding: 1px 7px;
      display: none;
    }
    #drawer-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #clear-all-btn {
      font-size: 12px;
      color: #9e9e9e;
      padding: 6px 10px;
      border-radius: 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 500;
      display: none;
    }
    #close-drawer-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: #eee;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Drawer list */
    #drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      touch-action: pan-y;
      scrollbar-width: thin;
      scrollbar-color: #bdbdbd transparent;
    }
    #drawer-list::-webkit-scrollbar { width: 4px; }
    #drawer-list::-webkit-scrollbar-track { background: transparent; }
    #drawer-list::-webkit-scrollbar-thumb { background: #bdbdbd; border-radius: 2px; }

    /* Empty state */
    #drawer-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      padding: 32px;
      text-align: center;
    }
    #drawer-empty span {
      font-size: 14px;
      color: #bdbdbd;
      font-weight: 400;
    }

    /* History item */
    .hist-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 12px;
      padding: 12px 16px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #eee;
      cursor: pointer;
      touch-action: pan-y;
      transition: background 0.1s;
    }
    .hist-item:active {
      background: #f5f5f5;
    }
    .hist-item-text {
      flex: 1;
      min-width: 0;
      text-align: left;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: "Noto Sans JP", sans-serif;
    }
    .hist-item-main {
      font-size: 15px;
      font-weight: 700;
      color: #1c1c1c;
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
      margin: 0;
    }
    .hist-item-time {
      font-size: 11px;
      color: #9e9e9e;
      margin-top: 2px;
      display: block;
    }
    .hist-delete-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bdbdbd;
      transition: background 0.1s, color 0.1s;
    }
    .hist-delete-btn:active {
      background: #eee;
      color: #757575;
    }

    body[data-theme="dark"], body[data-theme="dark"] #app {
      background: #121212;
    }
    body[data-theme="dark"] #card {
      background: #1e1e1e;
      box-shadow: 0 1px 3px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.25);
    }
    body[data-theme="dark"] #display-text p,
    body[data-theme="dark"] #card-hint span,
    body[data-theme="dark"] #drawer-title,
    body[data-theme="dark"] .hist-item-main {
      color: #f2f2f2;
    }
    body[data-theme="dark"] #input-area {
      caret-color: transparent;
    }
    body[data-theme="dark"] #caret-marker {
      background: #f2f2f2;
    }
    body[data-theme="dark"] #history-btn,
    body[data-theme="dark"] #theme-btn,
    body[data-theme="dark"] #text-controls {
      background: rgba(42,42,42,.96);
      border-color: #444;
      color: #eee;
    }
    body[data-theme="dark"] #history-btn svg,
    body[data-theme="dark"] #drawer-title-group svg {
      filter: invert(1);
    }
    body[data-theme="dark"] #auto-size-btn {
      background: #333;
      border-color: #555;
      color: #eee;
    }
    body[data-theme="dark"] #auto-size-btn.active {
      background: #eee;
      border-color: #eee;
      color: #222;
    }
    body[data-theme="dark"] #font-size-value,
    body[data-theme="dark"] #clear-all-btn {
      color: #aaa;
    }
    body[data-theme="dark"] #drawer {
      background: #202020;
    }
    body[data-theme="dark"] #drawer-header {
      border-bottom-color: #3a3a3a;
    }
    body[data-theme="dark"] #drawer-count-badge,
    body[data-theme="dark"] #close-drawer-btn {
      background: #383838;
      color: #ddd;
    }
    body[data-theme="dark"] .hist-item {
      background: #292929;
      border-color: #3c3c3c;
    }
    body[data-theme="dark"] .hist-item:active,
    body[data-theme="dark"] .hist-delete-btn:active {
      background: #404040;
    }
    body[data-theme="dark"] .hist-item-time,
    body[data-theme="dark"] .hist-delete-btn {
      color: #aaa;
    }
    body[data-theme="dark"] #drawer-empty span,
    body[data-theme="dark"] #placeholder span {
      color: #858585;
    }
    @media (max-height: 420px) {
      #text-controls { bottom: max(8px, env(safe-area-inset-bottom)); }
      #history-btn, #theme-btn {
        top: max(8px, env(safe-area-inset-top));
      }
    }
  </style>
</head>
<body>

<div id="app">

  <!-- Card wrapper (swipeable) -->
  <div id="card-wrap">
    <div id="card">
      <div id="display-area">
        <div id="placeholder"><span>ここに文を入力</span></div>
        <div id="display-text"><p id="display-p"></p></div>
        <textarea
          id="input-area"
          aria-label="メッセージ入力"
          spellcheck="false"
          autocorrect="off"
          autocapitalize="none"
        ></textarea>
        <!-- bottom swipe hint -->
        <div id="card-hint">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
            <path d="M9 18l-6-6 6-6" stroke="#1c1c1c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>スワイプで新規</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Left-edge swipe hint -->
  <div id="swipe-hint">
    <div class="arrow">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="bar"></div>
  </div>

  <!-- History button -->
  <button id="history-btn" aria-label="履歴を開く">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="5"  width="14" height="2" rx="1" fill="#3d3d3d"/>
      <rect x="3" y="11" width="18" height="2" rx="1" fill="#3d3d3d"/>
      <rect x="3" y="17" width="10" height="2" rx="1" fill="#3d3d3d"/>
    </svg>
    <span id="history-badge"></span>
  </button>

  <button id="theme-btn" aria-label="ダークモードに切り替え" title="テーマ切替">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div id="text-controls" aria-label="文字サイズ調整">
    <button id="auto-size-btn" class="active" type="button" aria-pressed="true">自動</button>
    <input id="font-size-slider" type="range" min="16" max="80" value="80" aria-label="文字サイズ" />
    <output id="font-size-value" for="font-size-slider">自動</output>
  </div>

  <!-- Drawer backdrop -->
  <div id="drawer-backdrop"></div>

  <!-- Drawer panel -->
  <div id="drawer" role="dialog" aria-label="履歴">
    <div id="drawer-header">
      <div id="drawer-title-group">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="5"  width="14" height="2" rx="1" fill="#3d3d3d"/>
          <rect x="3" y="11" width="18" height="2" rx="1" fill="#3d3d3d"/>
          <rect x="3" y="17" width="10" height="2" rx="1" fill="#3d3d3d"/>
        </svg>
        <p id="drawer-title">履歴</p>
        <span id="drawer-count-badge"></span>
      </div>
      <div id="drawer-actions">
        <button id="clear-all-btn">全消し</button>
        <button id="close-drawer-btn" aria-label="閉じる">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="drawer-list">
      <div id="drawer-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="#dedede" stroke-width="1.5"/>
          <path d="M12 7v5l3 3" stroke="#dedede" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>まだ履歴がありません</span>
      </div>
    </div>
  </div>

</div><!-- /#app -->

<script>
'use strict';

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
const STORAGE_KEY = 'voice-card-history';
const THEME_STORAGE_KEY = 'voice-card-theme';
const MAX_HISTORY = 20;

let history = loadHistory();
let automaticFontSize = true;
let fixedFontSize = 80;

/* ═══════════════════════════════════════
   ELEMENTS
═══════════════════════════════════════ */
const cardWrap    = document.getElementById('card-wrap');
const displayP    = document.getElementById('display-p');
const placeholder = document.getElementById('placeholder');
const cardHint    = document.getElementById('card-hint');
const input       = document.getElementById('input-area');
const swipeHint   = document.getElementById('swipe-hint');
const histBtn     = document.getElementById('history-btn');
const badge       = document.getElementById('history-badge');
const backdrop    = document.getElementById('drawer-backdrop');
const drawer      = document.getElementById('drawer');
const countBadge  = document.getElementById('drawer-count-badge');
const clearBtn    = document.getElementById('clear-all-btn');
const closeBtn    = document.getElementById('close-drawer-btn');
const drawerList  = document.getElementById('drawer-list');
const emptyState  = document.getElementById('drawer-empty');
const displayArea = document.getElementById('display-area');
const fontSlider  = document.getElementById('font-size-slider');
const fontValue   = document.getElementById('font-size-value');
const autoSizeBtn = document.getElementById('auto-size-btn');
const themeBtn    = document.getElementById('theme-btn');

const caretMarker = document.createElement('div');
caretMarker.id = 'caret-marker';
caretMarker.setAttribute('aria-hidden', 'true');
displayArea.appendChild(caretMarker);
const caretMirror = document.createElement('div');
caretMirror.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;';
displayArea.appendChild(caretMirror);

/* ═══════════════════════════════════════
   STORAGE
═══════════════════════════════════════ */
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveHistory() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch {}
}
function pushHistory(text) {
  const t = text.trim();
  if (!t) return;
  history = [
    { id: Date.now(), text: t, at: new Date().toISOString() },
    ...history.filter(h => h.text !== t)
  ].slice(0, MAX_HISTORY);
  saveHistory();
  renderHistory();
}

/* ═══════════════════════════════════════
   FONT SIZE (binary search)
═══════════════════════════════════════ */
const probe = document.createElement('div');
probe.style.cssText = `
  position:absolute; visibility:hidden; pointer-events:none;
  white-space:pre; word-break:break-word;
  font-family:"Noto Sans JP",sans-serif; font-weight:900;
  line-height:1.2; letter-spacing:-0.01em; padding:0; width:max-content;
`;
document.body.appendChild(probe);

function fitFontSize(text) {
  const aw = Math.max(40, displayArea.clientWidth - 56);
  const ah = Math.max(40, displayArea.clientHeight - 132);
  if (!text.trim()) return fixedFontSize;

  probe.style.width = 'max-content';
  probe.style.whiteSpace = 'pre';
  let lo = 16, hi = 80, best = 16;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    probe.style.fontSize = mid + 'px';
    probe.textContent = text;
    if (!text.includes('\n') && probe.getBoundingClientRect().width <= aw) {
      best = mid; lo = mid + 1;
    } else { hi = mid - 1; }
  }
  if (best >= 16 && !text.includes('\n')) {
    probe.style.fontSize = '16px';
    probe.textContent = text;
    if (probe.getBoundingClientRect().width <= aw) return best;
  }

  probe.style.width = aw + 'px';
  probe.style.whiteSpace = 'pre-wrap';
  lo = 16;
  hi = 80;
  best = 16;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    probe.style.fontSize = mid + 'px';
    probe.textContent = text;
    if (probe.scrollHeight <= ah) {
      best = mid; lo = mid + 1;
    } else { hi = mid - 1; }
  }
  return best;
}

/* ═══════════════════════════════════════
   TEXT INPUT
═══════════════════════════════════════ */
function updateDisplay() {
  const text = input.value;
  const empty = !text.trim();

  placeholder.style.display = empty ? 'flex' : 'none';
  displayP.parentElement.style.display = empty ? 'none' : 'flex';
  cardHint.classList.toggle('visible', !empty);

  const fs = automaticFontSize ? fitFontSize(text) : fixedFontSize;
  displayP.style.fontSize = fs + 'px';
  displayP.textContent = text;
  input.style.fontSize = fs + 'px';

  probe.style.width = Math.max(40, displayArea.clientWidth - 56) + 'px';
  probe.style.whiteSpace = 'pre-wrap';
  probe.style.fontSize = fs + 'px';
  probe.textContent = text || ' ';
  const contentHeight = probe.getBoundingClientRect().height;
  const availableHeight = Math.max(40, displayArea.clientHeight - 132);
  const topPadding = 40 + Math.max(0, (availableHeight - contentHeight) / 2);
  input.style.paddingTop = topPadding + 'px';
  input.style.paddingBottom = Math.max(92, displayArea.clientHeight - topPadding - contentHeight) + 'px';

  fontSlider.value = String(fixedFontSize);
  fontValue.textContent = automaticFontSize ? '自動' : `${fixedFontSize}px`;
  autoSizeBtn.classList.toggle('active', automaticFontSize);
  autoSizeBtn.setAttribute('aria-pressed', String(automaticFontSize));
  updateCaret();
}

function updateCaret() {
  if (document.activeElement !== input || input.selectionStart !== input.selectionEnd) {
    caretMarker.style.display = 'none';
    return;
  }

  const styles = getComputedStyle(input);
  const areaRect = displayArea.getBoundingClientRect();
  caretMirror.style.left = input.offsetLeft + 'px';
  caretMirror.style.top = input.offsetTop + 'px';
  caretMirror.style.width = input.clientWidth + 'px';
  caretMirror.style.boxSizing = 'border-box';
  caretMirror.style.padding = styles.padding;
  caretMirror.style.font = styles.font;
  caretMirror.style.letterSpacing = styles.letterSpacing;
  caretMirror.style.textAlign = styles.textAlign;
  caretMirror.style.lineHeight = styles.lineHeight;
  caretMirror.style.whiteSpace = 'pre-wrap';
  caretMirror.style.wordBreak = styles.wordBreak;
  caretMirror.style.overflowWrap = styles.overflowWrap;

  caretMirror.textContent = '';
  caretMirror.appendChild(document.createTextNode(input.value.slice(0, input.selectionStart)));
  const marker = document.createElement('span');
  marker.textContent = '\u200b';
  marker.style.cssText = 'display:inline-block;width:0;height:1em;line-height:1em;vertical-align:baseline;';
  caretMirror.appendChild(marker);
  caretMirror.appendChild(document.createTextNode(input.value.slice(input.selectionEnd)));

  const markerRect = marker.getBoundingClientRect();
  caretMarker.style.left = markerRect.left - areaRect.left - input.scrollLeft + 'px';
  caretMarker.style.top = markerRect.top - areaRect.top - input.scrollTop + 'px';
  caretMarker.style.height = markerRect.height ? markerRect.height + 'px' : parseFloat(styles.lineHeight) + 'px';
  caretMarker.style.display = 'block';
}

input.addEventListener('input', updateDisplay);
input.addEventListener('focus', updateCaret);
input.addEventListener('blur', () => { caretMarker.style.display = 'none'; });
input.addEventListener('keyup', updateCaret);
input.addEventListener('click', updateCaret);
input.addEventListener('select', updateCaret);
input.addEventListener('scroll', updateCaret);
document.addEventListener('selectionchange', updateCaret);
input.addEventListener('keydown', (event) => {
  if (event.key !== 'Enter' || event.isComposing || event.keyCode === 229) return;
  const start = input.selectionStart;
  const end = input.selectionEnd;
  if (start === end && start > 0 && start < input.value.length) {
    event.preventDefault();
    input.setRangeText('\n', start, end, 'end');
    input.dispatchEvent(new Event('input', { bubbles: true }));
    return;
  }
  event.preventDefault();
  input.blur();
});

fontSlider.addEventListener('input', () => {
  automaticFontSize = false;
  fixedFontSize = Number(fontSlider.value);
  updateDisplay();
});
autoSizeBtn.addEventListener('click', () => {
  automaticFontSize = true;
  updateDisplay();
});

function setTheme(theme, persist) {
  const isDark = theme === 'dark';
  document.body.dataset.theme = isDark ? 'dark' : 'light';
  themeBtn.setAttribute('aria-label', isDark ? 'ライトモードに切り替え' : 'ダークモードに切り替え');
  document.querySelector('meta[name="theme-color"]').content = isDark ? '#121212' : '#FFFFFF';
  if (persist) {
    try { localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light'); }
    catch (error) { console.warn('テーマ設定を保存できませんでした。', error); }
  }
}

try {
  setTheme(localStorage.getItem(THEME_STORAGE_KEY) === 'dark' ? 'dark' : 'light', false);
} catch (error) {
  console.warn('テーマ設定を読み込めませんでした。', error);
  setTheme('light', false);
}
themeBtn.addEventListener('click', () => {
  setTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark', true);
});

/* ═══════════════════════════════════════
   SWIPE (left only, text must be non-empty)
═══════════════════════════════════════ */
let touchStartX = null, touchStartY = null;
let isSwiping = false;
let currentOffset = 0;

function setOffset(x) {
  currentOffset = x;
  cardWrap.classList.add('no-transition');
  cardWrap.style.transform = `translateX(${x}px)`;
  swipeHint.classList.toggle('visible', x < -20);
}

function resetCard(animate) {
  cardWrap.classList.toggle('no-transition', !animate);
  if (animate) cardWrap.classList.remove('no-transition');
  cardWrap.style.transform = 'translateX(0)';
  swipeHint.classList.remove('visible');
  isSwiping = false;
  currentOffset = 0;
}

function commitCard() {
  pushHistory(input.value);
  input.value = '';
  // fly out, then reset instantly off-screen, then slide back
  cardWrap.classList.remove('no-transition');
  cardWrap.classList.add('fly-out');
  setTimeout(() => {
    cardWrap.classList.remove('fly-out');
    cardWrap.classList.add('no-transition');
    cardWrap.style.transform = 'translateX(0)';
    swipeHint.classList.remove('visible');
    isSwiping = false;
    currentOffset = 0;
    updateDisplay();
  }, 280);
}

document.addEventListener('touchstart', (e) => {
  if (drawer.classList.contains('open')) return;
  if (e.touches.length !== 1 || !(e.target instanceof Element) ||
      e.target.closest('#text-controls, #history-btn, #theme-btn')) return;
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  isSwiping = false;
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (drawer.classList.contains('open')) return;
  if (touchStartX === null) return;

  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;

  if (!isSwiping) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (Math.abs(dy) > Math.abs(dx) || dx > 0) {
      touchStartX = null;
      touchStartY = null;
      return;
    }
    isSwiping = true;
  }

  e.preventDefault();
  setOffset(Math.min(0, dx));
}, { passive: false });

document.addEventListener('touchend', () => {
  if (!isSwiping) {
    touchStartX = null;
    touchStartY = null;
    return;
  }
  if (currentOffset <= -90 && input.value.trim()) {
    commitCard();
  } else {
    resetCard(true);
  }
  touchStartX = null;
  touchStartY = null;
}, { passive: true });
document.addEventListener('touchcancel', () => {
  touchStartX = null;
  touchStartY = null;
  if (isSwiping) resetCard(true);
}, { passive: true });

/* ═══════════════════════════════════════
   DRAWER
═══════════════════════════════════════ */
function openDrawer() {
  backdrop.classList.add('open');
  drawer.classList.add('open');
}
function closeDrawer() {
  backdrop.classList.remove('open');
  drawer.classList.remove('open');
}

histBtn.addEventListener('click', openDrawer);
backdrop.addEventListener('click', closeDrawer);
closeBtn.addEventListener('click', closeDrawer);

// Swipe-right on drawer to close
let drawerTouchX = null;
drawer.addEventListener('touchstart', (e) => {
  drawerTouchX = e.touches[0].clientX;
}, { passive: true });
drawer.addEventListener('touchend', (e) => {
  if (drawerTouchX === null) return;
  if (e.changedTouches[0].clientX - drawerTouchX > 60) closeDrawer();
  drawerTouchX = null;
}, { passive: true });

/* ═══════════════════════════════════════
   HISTORY RENDERING
═══════════════════════════════════════ */
function formatRelTime(iso) {
  try {
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff / 60000);
    const h = Math.floor(diff / 3600000);
    const d = Math.floor(diff / 86400000);
    if (m < 1)  return 'たった今';
    if (m < 60) return `${m}分前`;
    if (h < 24) return `${h}時間前`;
    if (d < 7)  return `${d}日前`;
    const dt = new Date(iso);
    return `${dt.getMonth()+1}/${dt.getDate()}`;
  } catch { return ''; }
}

function renderHistory() {
  // Badge on main button
  if (history.length > 0) {
    badge.style.display = 'block';
    badge.textContent = history.length > 9 ? '9+' : String(history.length);
  } else {
    badge.style.display = 'none';
  }

  // Drawer header
  if (history.length > 0) {
    countBadge.style.display = 'inline';
    countBadge.textContent = String(history.length);
    clearBtn.style.display = 'inline';
  } else {
    countBadge.style.display = 'none';
    clearBtn.style.display = 'none';
  }

  // List
  // Remove all item nodes (keep empty state)
  [...drawerList.querySelectorAll('.hist-item')].forEach(el => el.remove());

  if (history.length === 0) {
    emptyState.style.display = 'flex';
    return;
  }
  emptyState.style.display = 'none';

  const frag = document.createDocumentFragment();
  history.forEach(item => {
    const el = document.createElement('div');
    el.className = 'hist-item';
    el.dataset.id = item.id;
    el.innerHTML = `
      <button class="hist-item-text" aria-label="${item.text}を呼び出す">
        <p class="hist-item-main"></p>
        <span class="hist-item-time"></span>
      </button>
      <button class="hist-delete-btn" aria-label="削除">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"
            stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    `;
    // Set text safely (avoid XSS)
    el.querySelector('.hist-item-main').textContent = item.text;
    el.querySelector('.hist-item-time').textContent = formatRelTime(item.at);

    // Recall
    el.querySelector('.hist-item-text').addEventListener('click', () => {
      input.value = item.text;
      updateDisplay();
      closeDrawer();
    });
    // Delete
    el.querySelector('.hist-delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      history = history.filter(h => h.id !== item.id);
      saveHistory();
      renderHistory();
    });

    frag.appendChild(el);
  });
  drawerList.insertBefore(frag, emptyState);
}

clearBtn.addEventListener('click', () => {
  history = [];
  saveHistory();
  renderHistory();
});

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
updateDisplay();
renderHistory();
window.addEventListener('resize', updateDisplay);
window.addEventListener('orientationchange', () => requestAnimationFrame(updateDisplay));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', updateDisplay);
}
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(updateDisplay);
}

/* ═══════════════════════════════════════
   SERVICE WORKER
═══════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
